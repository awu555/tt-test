<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Set 审核演示页</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #1f2937; }
    .page { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h2,h3 { margin: 0 0 10px; }
    .thumb { border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; padding: 8px; cursor: pointer; }
    .thumb.active { border-color: #2563eb; background: #eff6ff; }
    .row { margin-bottom: 10px; }
    label { margin-right: 10px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .sci { background: #fee2e2; color: #991b1b; }
    .sh { background: #fef3c7; color: #92400e; }
    .og { background: #dcfce7; color: #166534; }
    .muted { color: #6b7280; font-size: 13px; }
    textarea { width: 100%; min-height: 80px; }
    button { border: 0; background: #2563eb; color: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .kv { display: flex; justify-content: space-between; margin: 6px 0; }
    .result { font-weight: 700; color: #111827; }
    .small { font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="page">
    <h2>Image Set 审核演示页（单图判断 + 自动汇总）</h2>
    <p class="muted">规则：保留 Visual Result = Normal；Material Type 仅按 second_hand_ratio &gt;= 1/3 判定。</p>

    <div class="card" style="margin-bottom:16px;">
      <h3>模块0：Audio Judgment（前置）</h3>
      <div class="row">
        <span>是否存在音频 ASR：</span>
        <label><input type="radio" name="audioAsr" value="yes"> 是</label>
        <label><input type="radio" name="audioAsr" value="no" checked> 否</label>
      </div>
      <div class="row" id="audioMatchRow" style="display:none;">
        <span>音频是否与配对源完全一致：</span>
        <label><input type="radio" name="audioMatch" value="yes"> 是</label>
        <label><input type="radio" name="audioMatch" value="no" checked> 否</label>
      </div>
      <div class="small">若一致，final_result 直接为 Total Copied。</div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>图片列表</h3>
        <div id="imageList"></div>
        <button id="addImageBtn" type="button">+ 新增图片</button>
      </div>

      <div class="card">
        <h3>单图判断</h3>
        <div id="imageEditor"></div>
      </div>

      <div class="card">
        <h3>全局文本 & 结果</h3>
        <div class="row">
          <div>High Value Text Count: <input id="highInput" type="number" min="0" value="0" style="width:80px"></div>
          <div>Low Value Text Count: <input id="lowInput" type="number" min="0" value="0" style="width:80px"></div>
          <div>No Value Text Count: <input id="noInput" type="number" min="0" value="0" style="width:80px"></div>
        </div>
        <div class="row">
          <label>Caption / 备注：</label>
          <textarea id="caption"></textarea>
        </div>
        <hr>
        <div id="stats"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>输出 JSON（可直接演示）</h3>
      <pre id="output"></pre>
    </div>
  </div>

  <script>
    const state = {
      selected: 0,
      audioAsr: 'no',
      audioMatch: 'no',
      images: [makeImage(1), makeImage(2), makeImage(3)],
      text: { high: 0, low: 0, no: 0 },
      caption: ''
    };

    function makeImage(id) {
      return {
        id,
        textMode: true,
        watermark: false,
        textContentPair: false,
        pairGte50: false,
        sci: false,
        autoHighValue: false,
        manualHighValue: 0
      };
    }

    function classifyImage(img) {
      if (img.textMode) {
        if (img.watermark) return 'SCI';
        return img.textContentPair ? 'SECOND_HAND' : 'ORIGINAL';
      }
      if (img.pairGte50) return 'SECOND_HAND';
      return img.sci ? 'SCI' : 'ORIGINAL';
    }

    function compute() {
      const total = state.images.length || 1;
      let original_count = 0, SCI_count = 0, second_hand_count = 0;
      let autoHighValue = 0;

      state.images.forEach(img => {
        const cls = classifyImage(img);
        if (cls === 'ORIGINAL') original_count += 1;
        if (cls === 'SCI') SCI_count += 1;
        if (cls === 'SECOND_HAND') second_hand_count += 1;

        img.autoHighValue = (cls === 'SCI' || cls === 'SECOND_HAND');
        if (img.autoHighValue) autoHighValue += 1;
      });

      const manualHighTotal = state.images.reduce((sum, i) => sum + Number(i.manualHighValue || 0), 0);
      const high_value_text_count = Number(state.text.high || 0) + manualHighTotal;
      const low_value_text_count = Number(state.text.low || 0);
      const no_value_text_count = Number(state.text.no || 0);

      let overall_text;
      if (high_value_text_count >= 3) overall_text = 'high';
      else if (high_value_text_count >= 1 || low_value_text_count >= 1) overall_text = 'low';
      else overall_text = 'none';

      const original_ratio = original_count / total;
      const second_hand_ratio = second_hand_count / total;

      let visual_result;
      if (original_count === total) visual_result = 'Normal';
      else if (original_count === 0 && overall_text === 'none') visual_result = 'Total Copied';
      else if (original_ratio >= 0.5 || high_value_text_count >= 3) visual_result = 'High Cost';
      else if (original_count >= 1 || overall_text !== 'none') visual_result = 'Low Cost';
      else visual_result = 'Low Cost';

      const material_type = second_hand_ratio >= (1 / 3) ? 'Second-hand' : 'First-hand';

      let final_result = visual_result;
      if (state.audioAsr === 'yes' && state.audioMatch === 'yes') {
        final_result = 'Total Copied';
      }

      return {
        final_result,
        material_type,
        original_count,
        SCI_count,
        second_hand_count,
        high_value_text_count,
        low_value_text_count,
        no_value_text_count,
        meta: {
          total_images: total,
          original_ratio: Number(original_ratio.toFixed(4)),
          second_hand_ratio: Number(second_hand_ratio.toFixed(4)),
          overall_text,
          visual_result,
          auto_high_value_trigger_count: autoHighValue
        }
      };
    }

    function renderList() {
      const list = document.getElementById('imageList');
      list.innerHTML = '';
      state.images.forEach((img, idx) => {
        const cls = classifyImage(img);
        const div = document.createElement('div');
        div.className = `thumb ${idx === state.selected ? 'active' : ''}`;
        const label = cls === 'SCI' ? '<span class="pill sci">SCI</span>' : cls === 'SECOND_HAND' ? '<span class="pill sh">Second-hand</span>' : '<span class="pill og">Original</span>';
        div.innerHTML = `<div>Image #${img.id} ${label}</div><div class="small">manual high value: ${img.manualHighValue || 0}</div>`;
        div.onclick = () => { state.selected = idx; render(); };
        list.appendChild(div);
      });
    }

    function renderEditor() {
      const img = state.images[state.selected];
      const box = document.getElementById('imageEditor');
      if (!img) { box.innerHTML = '<div class="muted">暂无图片</div>'; return; }

      box.innerHTML = `
        <div class="row"><strong>当前图片：#${img.id}</strong></div>
        <div class="row">
          <span>Q1-1 Text Mode？</span>
          <label><input type="radio" name="textMode" value="yes" ${img.textMode ? 'checked' : ''}> 是</label>
          <label><input type="radio" name="textMode" value="no" ${!img.textMode ? 'checked' : ''}> 否</label>
        </div>

        <div id="textBranch" style="display:${img.textMode ? 'block' : 'none'};">
          <div class="row">
            <span>Q1-2 watermark / 来源标记？</span>
            <label><input type="radio" name="watermark" value="yes" ${img.watermark ? 'checked' : ''}> 是</label>
            <label><input type="radio" name="watermark" value="no" ${!img.watermark ? 'checked' : ''}> 否</label>
          </div>
          <div class="row" style="display:${img.watermark ? 'none' : 'block'};">
            <span>Q1-3 text_content_pair？</span>
            <label><input type="radio" name="textPair" value="yes" ${img.textContentPair ? 'checked' : ''}> 是</label>
            <label><input type="radio" name="textPair" value="no" ${!img.textContentPair ? 'checked' : ''}> 否</label>
          </div>
        </div>

        <div id="imageBranch" style="display:${img.textMode ? 'none' : 'block'};">
          <div class="row">
            <span>Q1-4 pair_image >= 50%？</span>
            <label><input type="radio" name="pair50" value="yes" ${img.pairGte50 ? 'checked' : ''}> 是</label>
            <label><input type="radio" name="pair50" value="no" ${!img.pairGte50 ? 'checked' : ''}> 否</label>
          </div>
          <div class="row" style="display:${img.pairGte50 ? 'none' : 'block'};">
            <span>Q1-5 SCI？</span>
            <label><input type="radio" name="sci" value="yes" ${img.sci ? 'checked' : ''}> 是</label>
            <label><input type="radio" name="sci" value="no" ${!img.sci ? 'checked' : ''}> 否</label>
          </div>
        </div>

        <div class="row">
          <span>自动触发 HighValue：</span>
          <strong>${img.autoHighValue ? '是（SCI/Second-hand）' : '否'}</strong>
        </div>
        <div class="row">
          <label>手动 high value text 计数（当前图）:</label>
          <input id="manualHigh" type="number" min="0" value="${img.manualHighValue || 0}" style="width:80px" />
        </div>
      `;

      bindEditorEvents();
    }

    function bindEditorEvents() {
      const img = state.images[state.selected];
      document.querySelectorAll('input[name="textMode"]').forEach(el => el.onchange = (e) => { img.textMode = e.target.value === 'yes'; render(); });
      document.querySelectorAll('input[name="watermark"]').forEach(el => el.onchange = (e) => { img.watermark = e.target.value === 'yes'; render(); });
      document.querySelectorAll('input[name="textPair"]').forEach(el => el.onchange = (e) => { img.textContentPair = e.target.value === 'yes'; render(); });
      document.querySelectorAll('input[name="pair50"]').forEach(el => el.onchange = (e) => { img.pairGte50 = e.target.value === 'yes'; render(); });
      document.querySelectorAll('input[name="sci"]').forEach(el => el.onchange = (e) => { img.sci = e.target.value === 'yes'; render(); });
      const manualHigh = document.getElementById('manualHigh');
      manualHigh.oninput = (e) => { img.manualHighValue = Math.max(0, Number(e.target.value || 0)); renderStatsOnly(); };
    }

    function renderStatsOnly() {
      const result = compute();
      document.getElementById('stats').innerHTML = `
        <div class="kv"><span>original_count</span><span>${result.original_count}</span></div>
        <div class="kv"><span>SCI_count</span><span>${result.SCI_count}</span></div>
        <div class="kv"><span>second_hand_count</span><span>${result.second_hand_count}</span></div>
        <div class="kv"><span>high_value_text_count</span><span>${result.high_value_text_count}</span></div>
        <div class="kv"><span>low_value_text_count</span><span>${result.low_value_text_count}</span></div>
        <div class="kv"><span>no_value_text_count</span><span>${result.no_value_text_count}</span></div>
        <hr>
        <div class="kv"><span>material_type</span><span class="result">${result.material_type}</span></div>
        <div class="kv"><span>visual_result</span><span class="result">${result.meta.visual_result}</span></div>
        <div class="kv"><span>final_result</span><span class="result">${result.final_result}</span></div>
      `;
      document.getElementById('output').textContent = JSON.stringify(result, null, 2);
    }

    function render() {
      renderList();
      renderEditor();
      renderStatsOnly();
    }

    document.querySelectorAll('input[name="audioAsr"]').forEach(el => el.onchange = (e) => {
      state.audioAsr = e.target.value;
      document.getElementById('audioMatchRow').style.display = state.audioAsr === 'yes' ? 'block' : 'none';
      renderStatsOnly();
    });
    document.querySelectorAll('input[name="audioMatch"]').forEach(el => el.onchange = (e) => {
      state.audioMatch = e.target.value;
      renderStatsOnly();
    });

    document.getElementById('highInput').oninput = (e) => { state.text.high = Math.max(0, Number(e.target.value || 0)); renderStatsOnly(); };
    document.getElementById('lowInput').oninput = (e) => { state.text.low = Math.max(0, Number(e.target.value || 0)); renderStatsOnly(); };
    document.getElementById('noInput').oninput = (e) => { state.text.no = Math.max(0, Number(e.target.value || 0)); renderStatsOnly(); };
    document.getElementById('caption').oninput = (e) => { state.caption = e.target.value; };

    document.getElementById('addImageBtn').onclick = () => {
      const id = state.images.length ? state.images[state.images.length - 1].id + 1 : 1;
      state.images.push(makeImage(id));
      state.selected = state.images.length - 1;
      render();
    };

    render();
  </script>
</body>
</html>
